name: qalbu

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: qalbu
      POSTGRES_USER: qalbu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=8MB
      - -c
      - max_connections=20
      - -c
      - effective_cache_size=256MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qalbu -d qalbu"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    environment:
      # Query embedding + chat model both stay resident on a 4 GB VPS.
      OLLAMA_MAX_LOADED_MODELS: "2"
      OLLAMA_KEEP_ALIVE: "30m"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  qalbu-api:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://qalbu:${POSTGRES_PASSWORD}@postgres:5432/qalbu
      OLLAMA_BASE_URL: http://ollama:11434
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  qalbu-web:
    build:
      context: .
      dockerfile: deploy/lighttpd/Dockerfile
    ports:
      - "${QALBU_HTTP_PORT:-8000}:8000"
    depends_on:
      qalbu-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  ollama:
