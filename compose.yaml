services:
  qalbu-api:
    build:
      context: .
    environment:
      APP_ENV: ${APP_ENV:-development}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      JINA_API_KEY: ${JINA_API_KEY:-}
      JINA_EMBEDDING_MODEL: ${JINA_EMBEDDING_MODEL:-jina-embeddings-v5-text-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      MIN_RETRIEVAL_SCORE: ${MIN_RETRIEVAL_SCORE:-0.32}
      TOP_K_RETRIEVAL: ${TOP_K_RETRIEVAL:-15}
      RETRIEVAL_PARENT_K: ${RETRIEVAL_PARENT_K:-4}
      CHAT_RATE_LIMIT_PER_MINUTE: ${CHAT_RATE_LIMIT_PER_MINUTE:-10}
      RAG_CACHE_VERSION: ${RAG_CACHE_VERSION:-qalbu-mvp-v1}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8000}
      QALBU_PROFILE: ${QALBU_PROFILE:-local}
      CRISIS_LINE: ${CRISIS_LINE:-}
      CRISIS_LINE_LABEL: ${CRISIS_LINE_LABEL:-Layanan darurat setempat}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-30}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/service
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
