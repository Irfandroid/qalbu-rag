services:
  - type: web
    name: qalbu-rag
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: JINA_API_KEY
        sync: false
      - key: JINA_EMBEDDING_MODEL
        value: jina-embeddings-v5-text-small
      - key: EMBEDDING_DIMENSIONS
        value: "768"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: MIN_RETRIEVAL_SCORE
        value: "0.32"
      - key: TOP_K_RETRIEVAL
        value: "15"
      - key: RETRIEVAL_PARENT_K
        value: "4"
      - key: MAX_CONTEXT_TOKENS
        value: "1800"
      - key: REQUEST_TIMEOUT_SECONDS
        value: "30"
      - key: CHAT_RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: RAG_CACHE_VERSION
        value: qalbu-mvp-v1
      - key: QALBU_PROFILE
        value: render
      - key: CRISIS_LINE
        sync: false
      - key: CRISIS_LINE_LABEL
        value: Layanan darurat setempat
