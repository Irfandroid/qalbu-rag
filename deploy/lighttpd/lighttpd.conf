server.document-root = "/srv/frontend"
server.port = 8000
server.modules += ("mod_proxy", "mod_setenv", "mod_accesslog")

# SSE (/api/v1/chat) must be streamed, not buffered by the proxy.
server.stream-response-body = 2
# Local models can take minutes on CPU; keep the proxy from closing the socket.
server.max-read-idle = 300
server.max-write-idle = 300
server.max-request-size = 64

index-file.names = ("index.html")

mimetype.assign = (
  ".html" => "text/html; charset=utf-8",
  ".css" => "text/css; charset=utf-8",
  ".js" => "text/javascript; charset=utf-8",
  ".json" => "application/json",
  ".svg" => "image/svg+xml",
  ".png" => "image/png",
  ".jpg" => "image/jpeg",
  ".jpeg" => "image/jpeg",
  ".webp" => "image/webp",
  ".ico" => "image/x-icon",
  ".woff" => "font/woff",
  ".woff2" => "font/woff2",
  ".txt" => "text/plain; charset=utf-8",
)

setenv.add-response-header = (
  "X-Content-Type-Options" => "nosniff",
  "Referrer-Policy" => "no-referrer"
)

$HTTP["url"] =~ "^/(index\.html)?$" {
  setenv.add-response-header += ("Cache-Control" => "no-store")
}

$HTTP["url"] =~ "^/api/" {
  proxy.server = ("" => (("host" => "qalbu-api", "port" => 8000)))
}

$HTTP["url"] =~ "^/dataset" {
  proxy.server = ("" => (("host" => "qalbu-api", "port" => 8000)))
}

accesslog.filename = "/dev/stdout"
